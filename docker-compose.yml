services:
  nginx:
    image: nginx:alpine
    container_name: hotel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - hotel

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hotel-php
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hotel

  mysql:
    image: mysql:8
    container_name: hotel-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hotel_aurora
      MYSQL_USER: aurora
      MYSQL_PASSWORD: aurora_secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - hotel-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hotel

  node:
    image: node:20-alpine
    container_name: hotel-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    # Puerto ya no necesario en modo build — Vite dev server no corre
    command: sh -c "npm install && npm run build && tail -f /dev/null"
    networks:
      - hotel

volumes:
  hotel-mysql-data:

networks:
  hotel:
    driver: bridge